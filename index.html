<!doctype html>
<html lang="it">
<head>

<body>
  <a class="skip-link" href="#app">Salta al contenuto</a>

  <!-- Intestazione del sito -->
  <header class="site-header">
    <div>
      <!-- Etichetta superiore con versione/riferimento dei dati -->
      <p class="eyebrow">SRD 5.2.1</p>

      <!-- Titolo principale aggiornabile via JavaScript -->
      <h1 id="site-title">D&D Reference</h1>

      <!-- Sottotitolo aggiornabile via JavaScript -->
      <p id="site-subtitle" class="subtitle">Mostri, incantesimi, classi, oggetti magici, regole e glossario</p>
    </div>
  </header>

  <!-- Contenitore principale dell’applicazione -->
  <main id="app" class="app-shell" aria-live="polite">
    <!-- Vista home -->
    <section id="home-view" class="view"></section>

    <!-- Vista lista, inizialmente nascosta -->
    <section id="list-view" class="view" hidden></section>

    <!-- Vista dettaglio, inizialmente nascosta -->
    <section id="detail-view" class="view" hidden></section>
    <p>©2026 <a href="legal.html">Copyright e info sul progetto</a><br><small>v.2.20260523</small>
</p>
      </main>

  <!-- Template mostrato durante il caricamento dei dati -->
  <template id="loading-template">
    <div class="state-box">Caricamento dati...</div>
  </template>

  <!-- Template mostrato in caso di errore nel caricamento -->
  <template id="error-template">
    <div class="state-box state-box--error">
      <strong>Impossibile caricare l'app.</strong>

      <!-- Suggerimento per avviare correttamente il sito in locale -->
      <p>
        I dati locali non sono disponibili oppure il sito non e servito via HTTP.
      </p>
      <p>
        Apri la <a href="fallback.html">pagina locale di fallback</a> per le istruzioni di ripristino.
      </p>
    </div>
  </template>

  <!-- Core del dice roller, condiviso tra app e test -->
  <script src="assets/js/dice-roller.js" defer></script>

  <!-- Script principale dell’app, caricato dopo il parsing dell’HTML -->
  <script src="assets/js/app.js?v=20260514-classes-section" defer></script>

</html>
