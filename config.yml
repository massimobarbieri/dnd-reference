# Configurazione principale della web app D&D Reference.
# Questo file e' pensato per essere modificato senza toccare il codice JavaScript.
site:
  title: D&D Reference
  subtitle: Mostri, incantesimi, classi, specie, background, equipaggiamento, talenti, lingue, scheda personaggio, oggetti magici, regole e glossario SRD 5.2.1
  language: it
  default_section: monsters
  enable_favorites: true
  compact_cards: true
  show_monster_images: true
  image_fallback_text: Immagine non disponibile

ui:
  # Numero minimo di caratteri oltre il quale una colonna di tabella va a capo automaticamente.
  table_wrap_threshold: 10

paths:
  monsters: data/srd/5.2.1/json/srd_5_2_1_monsters.json
  spells: data/srd/5.2.1/json/srd_5_2_1_spells.json
  classes: data/srd/5.2.1/json/srd_5_2_1_classes.json
  species: data/srd/5.2.1/json/srd_5_2_1_species.json
  backgrounds: data/srd/5.2.1/json/srd_5_2_1_backgrounds.json
  equipment: data/srd/5.2.1/json/srd_5_2_1_equipment.json
  feats: data/srd/5.2.1/json/srd_5_2_1_feats.json
  languages: data/srd/5.2.1/json/srd_5_2_1_languages.json
  magic_items: data/srd/5.2.1/json/srd_5_2_1_magic_items.json
  rules: data/srd/5.2.1/json/srd_5_2_1_rules.json
  rules_glossary: data/srd/5.2.1/json/srd_5_2_1_rules_glossary.json
  monster_images: monster-images.yml

labels:
  monsters: Mostri
  spells: Incantesimi
  classes: Classi
  species: Specie
  backgrounds: Background
  equipment: Equipaggiamento
  feats: Talenti
  languages: Lingue
  character_sheet: Scheda
  magic_items: Oggetti magici
  rules: Regole
  rules_glossary: Glossario
  favorites: Preferiti
  search_placeholder: Cerca per nome, tipo, descrizione...
  empty_results: Nessun risultato trovato.
  empty_favorites: Non hai ancora salvato preferiti in questa sezione.
